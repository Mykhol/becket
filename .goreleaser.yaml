# GoReleaser config — cross-compiled binaries + checksums, attached to the
# GitHub release on tag push (see .github/workflows/release.yml).
# Validate locally with: goreleaser check  /  goreleaser build --snapshot --clean
version: 2

project_name: becket

before:
  hooks:
    - go mod tidy

builds:
  - id: becket
    main: .
    binary: becket
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    # Version is read from main.version, stamped from the git tag.
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: becket
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      # completions are generated at runtime via `becket completion` / shell-init

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-dev"

changelog:
  use: github
  sort: asc

# Owner/name are inferred from the git remote (Mykhol/becket).
release:
  draft: false
  prerelease: auto
  # Replace existing assets so re-running a release (e.g. a re-pushed tag) is
  # idempotent instead of failing with "asset already_exists".
  mode: replace

# Homebrew tap: publishes Formula/becket.rb to Mykhol/homebrew-tap on release.
# Requires a cross-repo token (the default GITHUB_TOKEN can't push to another
# repo) provided as the HOMEBREW_TAP_TOKEN secret/env in the release workflow.
homebrew_casks:
  - name: becket
    repository:
      owner: Mykhol
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/Mykhol/becket"
    description: "Cross-repo git-worktree workspaces"
    binaries:
      - becket
    # becket is unsigned; strip the Gatekeeper quarantine bit so it runs after
    # `brew install` without "developer cannot be verified". (Completions are
    # available via `becket completion` / `becket shell-init`.)
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/becket"]
          end
