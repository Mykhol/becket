name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, so `git describe` yields a real version

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l internal main.go main_test.go)"
          if [ -n "$unformatted" ]; then echo "needs gofmt:"; echo "$unformatted"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # Go-native test suite: per-package unit tests plus the testscript
      # (.txtar) end-to-end scenarios under tests/testscripts/, including the
      # two rebase-conflict scenarios (14, 15). Those capture git's own message
      # text; if a future git release changes the wording they may need
      # regenerating with `go test ./... -run TestScripts -update`.
      - name: go test
        run: go test ./... -count=1
